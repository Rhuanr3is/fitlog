<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#c8ff00">
<title>FitLog — Mapeador de Exercícios</title>
<style>
:root{--bg:#0a0a0f;--s:#111118;--s2:#1a1a24;--b:#2a2a38;--a:#c8ff00;--o:#ff6b35;--t:#e8e8f0;--m:#77778b;--g:#39ff9a}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--t);font:14px/1.45 system-ui,sans-serif;min-height:100vh}
button{font:inherit}
.app{max-width:860px;margin:auto;padding:28px 18px 50px}
header{display:flex;justify-content:space-between;align-items:end;border-bottom:1px solid var(--b);padding-bottom:18px;margin-bottom:20px}
.logo{font-size:2rem;font-weight:800;letter-spacing:-2px}.logo span{color:var(--a)}
.date{font-size:.72rem;color:var(--m);text-transform:uppercase}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.card{background:var(--s);border:1px solid var(--b);border-radius:10px;padding:14px}
.label{font-size:.65rem;color:var(--m);text-transform:uppercase;letter-spacing:1.5px}
.value{font-size:1.7rem;font-weight:800;margin-top:4px}
.banner{display:flex;justify-content:space-between;gap:15px;align-items:center;background:var(--s);border:1px solid var(--b);border-radius:12px;padding:18px 20px;margin-bottom:18px}
.banner h2{font-size:1rem}.sub{color:var(--m);font-size:.75rem;margin-top:3px}.big{font-size:2.5rem;font-weight:900;color:var(--a)}
.panel{background:var(--s);border:1px solid var(--b);border-radius:12px;padding:18px;margin-bottom:18px}
.title{color:var(--m);font-size:.75rem;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:12px}
.period{margin:14px 0}.ph{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:var(--s2);border-radius:8px;margin-bottom:6px}
.ph strong{font-size:.85rem}.ph small{color:var(--m)}
.item{display:flex;align-items:center;gap:10px;padding:11px 10px;border:1px solid var(--b);border-radius:8px;margin:5px 0;background:var(--bg)}
.check{width:23px;height:23px;border:2px solid var(--b);border-radius:6px;display:grid;place-items:center;cursor:pointer;flex:none}
.item.done .check{background:var(--g);border-color:var(--g);color:#07100c}.item.done .name{text-decoration:line-through;color:var(--m)}
.emoji{font-size:1.1rem}.info{flex:1;min-width:0}.name{font-weight:700}.cat{font-size:.65rem;color:var(--m);text-transform:uppercase}
.meta{text-align:right}.qty{font-weight:800;color:var(--a)}.unit{font-size:.62rem;color:var(--m);display:block}
.actions{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.btn{border:1px solid var(--b);background:transparent;color:var(--t);border-radius:6px;padding:5px 8px;font-size:.65rem;cursor:pointer}
.btn:hover{border-color:var(--a)}.timer{color:var(--a)}
.chart{height:150px;display:flex;align-items:end;gap:8px;padding:12px 5px 22px;border-bottom:1px solid var(--b)}
.barwrap{flex:1;height:100%;display:flex;align-items:end;justify-content:center;position:relative}
.bar{width:65%;min-height:3px;background:var(--o);border-radius:5px 5px 0 0;opacity:.65}.bar.today{background:var(--a);opacity:1}
.day{position:absolute;bottom:-20px;font-size:.6rem;color:var(--m)}
.note{color:var(--m);font-size:.7rem;margin-top:10px}
.modal{position:fixed;inset:0;background:#000b;display:none;place-items:center;padding:18px;z-index:10}.modal.open{display:grid}
.modalbox{width:min(520px,100%);max-height:90vh;overflow:auto;background:var(--s);border:1px solid var(--b);border-radius:14px;padding:20px}
.modalhead{display:flex;justify-content:space-between;gap:10px}.close{border:0;background:none;color:var(--m);font-size:1.5rem;cursor:pointer}
.timerbig{text-align:center;font-size:4rem;font-weight:900;color:var(--a);padding:25px 0}
.modalactions{display:flex;justify-content:center;gap:8px}.modalactions button{padding:10px 14px}
.howto p,.howto li{color:#c8c8d4;margin:8px 0}.howto h3{margin:12px 0 5px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(20px);background:var(--s2);border:1px solid var(--b);padding:10px 14px;border-radius:8px;opacity:0;pointer-events:none;transition:.2s;z-index:20}.toast.show{opacity:1;transform:translateX(-50%)}
@media(max-width:600px){.stats{grid-template-columns:1fr 1fr}.stats .card:last-child{grid-column:1/-1}.banner{align-items:flex-start}.big{font-size:2rem}.app{padding:20px 12px 40px}}
</style>
</head>
<body>
<div class="app">
<header><div class="logo">FIT<span>LOG</span></div><div id="date" class="date"></div></header>
<div class="stats">
<div class="card"><div class="label">Sessão</div><div id="statSession" class="value">—</div></div>
<div class="card"><div class="label">Concluídos</div><div id="statDone" class="value">—</div></div>
<div class="card"><div class="label">Treinos na semana</div><div id="statWeek" class="value">—</div></div>
</div>
<div class="banner"><div><h2 id="status">—</h2><div id="sub" class="sub"></div></div><div><div id="reps" class="big">—</div></div></div>
<div class="panel"><div class="title">Treino de hoje</div><div id="content"></div></div>
<div class="panel"><div class="title">Histórico — 7 dias</div><div id="chart" class="chart"></div><div class="note">Cada barra representa exercícios concluídos.</div></div>
<div class="panel"><button id="notif" class="btn" onclick="requestNotifications()">🔔 Ativar lembretes</button><div class="note">Os lembretes funcionam enquanto esta página puder permanecer ativa no navegador.</div></div>
</div>

<div id="timerModal" class="modal"><div class="modalbox">
<div class="modalhead"><strong id="timerTitle">Timer</strong><button class="close" onclick="closeTimer()">×</button></div>
<div id="timerBig" class="timerbig">00:00</div>
<div class="modalactions"><button class="btn timer" onclick="startTimer()">▶ Iniciar</button><button class="btn" onclick="pauseTimer()">⏸ Pausar</button><button class="btn" onclick="resetTimer()">↺ Reset</button></div>
</div></div>

<div id="howtoModal" class="modal"><div class="modalbox"><div class="modalhead"><strong id="howtoTitle"></strong><button class="close" onclick="closeHowto()">×</button></div><div id="howto" class="howto"></div></div></div>
<div id="toast" class="toast"></div>

<script>
const EXERCISES=[
{id:'flexao',emoji:'💪',name:'Flexão de Braço',cat:'Musculação',unit:'reps',text:'Mãos no chão na largura dos ombros. Desça o peito mantendo o corpo alinhado e empurre de volta.'},
{id:'rosca',emoji:'🏋️',name:'Rosca Direta',cat:'Musculação',unit:'reps',text:'Mantenha os cotovelos junto ao corpo e flexione os braços de forma controlada.'},
{id:'avancos',emoji:'🦵',name:'Avanços (Afundos)',cat:'Musculação',unit:'reps',text:'Dê um passo à frente, flexione os joelhos mantendo o tronco estável e retorne.'},
{id:'agachamento',emoji:'🏃',name:'Agachamento',cat:'Musculação',unit:'reps',text:'Pés afastados, quadril para trás e joelhos acompanhando a direção dos pés. Suba controladamente.'},
{id:'prancha',emoji:'🧘',name:'Prancha',cat:'Core',unit:'seg',timer:true,text:'Apoie antebraços e pés, mantenha o corpo alinhado e contraia o abdômen durante todo o exercício.'},
{id:'panturrilha',emoji:'🦶',name:'Levantamento de Panturrilha',cat:'Musculação',unit:'reps',text:'Eleve os calcanhares, faça uma breve pausa no alto e desça lentamente.'},
{id:'gluteo',emoji:'🍑',name:'Flexão de Glúteo',cat:'Musculação',unit:'reps',text:'Contraia os glúteos durante o movimento e mantenha o tronco estável.'},
{id:'puxada',emoji:'🙌',name:'Puxada Inclinada',cat:'Musculação',unit:'reps',text:'Incline o tronco, puxe os cotovelos para trás e retorne com controle.'}
];
const REST=[
['🌸','Saudação ao Sol',300],['🌿','Postura do Pombo',120],['🌊','Gato e Vaca',120],
['💫','The Hundred',120],['🔄','Roll Up',120],['🦵','Single Leg Circle',120],
['🚶','Caminhada Leve',1200],['🌀','Polichinelo Suave',180],['🫁','Respiração 4-7-8',300],['🧠','Body Scan',600]
];
const KEY='fitlog_checks_v1';
let checks=JSON.parse(localStorage.getItem(KEY)||'{}');
let timer={total:0,left:0,key:'',id:null};

function dateKey(d=new Date()){return d.toISOString().slice(0,10)}
function daysSinceStart(){let a=new Date(2026,0,1),b=new Date();return Math.max(0,Math.floor((new Date(b.getFullYear(),b.getMonth(),b.getDate())-a)/86400000))}
function session(){let d=daysSinceStart(), training=d%2===0;return{training,reps:Math.floor(d/2)+1}}
function split(n){let a=Math.floor(n/3);return[a,a,n-a*2]}
function save(){localStorage.setItem(KEY,JSON.stringify(checks))}
function today(){return checks[dateKey()]||(checks[dateKey()]={})}
function weekCount(){let n=0;for(let i=0;i<7;i++){let d=new Date();d.setDate(d.getDate()-i);let c=checks[dateKey(d)]||{};if(Object.values(c).some(Boolean))n++}return n}
function toggle(key){let c=today();c[key]=!c[key];save();toast(c[key]?'✓ Concluído':'Desmarcado');render()}
function render(){
let s=session(), r=split(s.reps), c=today();
document.getElementById('date').textContent=new Intl.DateTimeFormat('pt-BR',{weekday:'short',day:'2-digit',month:'short',year:'numeric'}).format(new Date()).toUpperCase();
document.getElementById('status').textContent=s.training?'DIA DE TREINO':'DIA DE DESCANSO ATIVO';
document.getElementById('sub').textContent=s.training?'8 exercícios · 3 períodos':'10 exercícios de recuperação';
document.getElementById('reps').textContent=s.training?s.reps:'REST';
document.getElementById('statSession').textContent=s.training?s.reps:'—';
document.getElementById('statDone').textContent=Object.values(c).filter(Boolean).length;
document.getElementById('statWeek').textContent=weekCount();
let out='';
if(s.training){
const periods=[['🌅','Manhã','08:00',r[0]],['☀️','Tarde','14:00',r[1]],['🌙','Noite','23:00',r[2]]];
for(const [em,p,t,qty] of periods){out+=`<div class="period"><div class="ph"><strong>${em} ${p}</strong><small>${t} · ${qty} reps</small></div>`;
for(const e of EXERCISES){let k=e.id+'_'+(['Manhã','Tarde','Noite'].indexOf(p)===0?'morning':(['Manhã','Tarde','Noite'].indexOf(p)===1?'afternoon':'night'));let done=!!c[k];out+=item(e,qty,k,done)}out+='</div></div>'}
}else{
for(const [i,x] of REST.entries()){let k='rest_'+i,done=!!c[k];out+=`<div class="item ${done?'done':''}"><div class="check" onclick="toggle('${k}')">${done?'✓':''}</div><div class="emoji">${x[0]}</div><div class="info"><div class="name">${x[1]}</div><div class="cat">Recuperação</div><div class="actions"><button class="btn timer" onclick="openTimer(${x[2]},'${k}','${x[0]} ${x[1]}')">▶ TIMER</button><button class="btn" onclick="howtoRest('${x[1]}')">? COMO FAZER</button></div></div><div class="meta"><span class="qty">${fmt(x[2])}</span><span class="unit">min</span></div></div>`}
}
document.getElementById('content').innerHTML=out;chart()
}
function item(e,qty,k,done){return `<div class="item ${done?'done':''}"><div class="check" onclick="toggle('${k}')">${done?'✓':''}</div><div class="emoji">${e.emoji}</div><div class="info"><div class="name">${e.name}</div><div class="cat">${e.cat}</div><div class="actions">${e.timer&&!done?`<button class="btn timer" onclick="openTimer(${qty},'${k}','${e.emoji} ${e.name}')">▶ INICIAR</button>`:''}<button class="btn" onclick="howto('${e.id}')">? COMO FAZER</button></div></div><div class="meta"><span class="qty">${qty}</span><span class="unit">${e.unit}</span></div></div>`}
function fmt(sec){let m=Math.floor(sec/60);return m+':'+String(sec%60).padStart(2,'0')}
function chart(){let el=document.getElementById('chart'),vals=[],max=1;for(let i=6;i>=0;i--){let d=new Date();d.setDate(d.getDate()-i);let v=Object.values(checks[dateKey(d)]||{}).filter(Boolean).length;vals.push({d,v});max=Math.max(max,v)}el.innerHTML=vals.map((x,i)=>`<div class="barwrap"><div class="bar ${i===6?'today':''}" style="height:${Math.max(3,x.v/max*100)}%"></div><span class="day">${new Intl.DateTimeFormat('pt-BR',{weekday:'short'}).format(x.d).slice(0,3)}</span></div>`).join('')}
function howto(id){let e=EXERCISES.find(x=>x.id===id);document.getElementById('howtoTitle').textContent=e.emoji+' '+e.name;document.getElementById('howto').innerHTML=`<h3>Como executar</h3><p>${e.text}</p><h3>Equipamento</h3><p>Depende da variação. Faça o movimento de forma controlada e respeite seus limites.</p>`;document.getElementById('howtoModal').classList.add('open')}
function howtoRest(name){document.getElementById('howtoTitle').textContent=name;document.getElementById('howto').innerHTML='<p>Execute lentamente, respirando de forma confortável. Interrompa se houver dor.</p>';document.getElementById('howtoModal').classList.add('open')}
function closeHowto(){document.getElementById('howtoModal').classList.remove('open')}
function openTimer(sec,key,name){clearInterval(timer.id);timer={total:sec,left:sec,key,id:null};document.getElementById('timerTitle').textContent=name;document.getElementById('timerModal').classList.add('open');timerUI()}
function timerUI(){document.getElementById('timerBig').textContent=fmt(timer.left)}
function startTimer(){if(timer.left<=0)return;clearInterval(timer.id);timer.id=setInterval(()=>{timer.left--;timerUI();if(timer.left<=0){clearInterval(timer.id);today()[timer.key]=true;save();beep();toast('✓ Exercício concluído!');setTimeout(()=>{closeTimer();render()},700)}},1000)}
function pauseTimer(){clearInterval(timer.id)}
function resetTimer(){clearInterval(timer.id);timer.left=timer.total;timerUI()}
function closeTimer(){clearInterval(timer.id);document.getElementById('timerModal').classList.remove('open')}
function beep(){try{let A=window.AudioContext||window.webkitAudioContext,c=new A();[880,880,1320].forEach((f,i)=>{let o=c.createOscillator(),g=c.createGain(),t=c.currentTime+i*.2;o.connect(g);g.connect(c.destination);o.frequency.value=f;g.gain.setValueAtTime(.18,t);g.gain.exponentialRampToValueAtTime(.001,t+.15);o.start(t);o.stop(t+.16)})}catch(e){}}
function toast(m){let t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>t.classList.remove('show'),1800)}
async function requestNotifications(){if(!('Notification'in window))return toast('Notificações não suportadas');let p=await Notification.requestPermission();document.getElementById('notif').textContent=p==='granted'?'✓ Lembretes ativados':'🔔 Ativar lembretes';if(p==='granted')schedule()}
function schedule(){let s=session();if(!s.training)return;for(const [h,label,r] of [[8,'🌅 Manhã',split(s.reps)[0]],[14,'☀️ Tarde',split(s.reps)[1]],[23,'🌙 Noite',split(s.reps)[2]]]){let d=new Date();d.setHours(h,0,0,0);let ms=d-Date.now();if(ms>0)setTimeout(()=>new Notification('FitLog — '+label,{body:`Hora do treino! ${r} repetições de cada exercício.`}),ms)}}
document.getElementById('timerModal').addEventListener('click',e=>{if(e.target===e.currentTarget)closeTimer()});
document.getElementById('howtoModal').addEventListener('click',e=>{if(e.target===e.currentTarget)closeHowto()});
render();
</script>
</body>
</html>
